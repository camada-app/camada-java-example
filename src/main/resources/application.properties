# camada-java-example. CAMADA_* are read from the process environment (or .env, loaded as default
# properties by ExampleApplication) — nothing here maps them.
server.port=3006
# Must stay `none` (Spring Boot's default off cloud platforms): NATIVE or FRAMEWORK would have Tomcat's
# RemoteIpValve rewrite the peer from X-Forwarded-For for any client, before camada's trusted-proxy
# rules (CAMADA_TRUSTED_PROXY, or the tenant config) get to judge the header — any caller could then
# pick the address camada enforces against.
server.forward-headers-strategy=none
spring.main.banner-mode=off
logging.level.root=warn
